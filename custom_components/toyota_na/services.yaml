  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na

set_charge_schedule:
  name: Set charge schedule
  description: Create or update a multi-day charge schedule. Times use the vehicle's local time.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
    schedule_id:
      description: ID from Charge Schedules. Omit to create a new schedule.
      selector:
        number:
          min: 0
          step: 1
          mode: box
    enabled:
      description: Enable the schedule. New schedules default to enabled.
      selector:
        boolean:
    start_time:
      description: Charging start time, required for new schedules. Use whole minutes.
      selector:
        time:
    end_time:
      description: Charging end time, required for new schedules. Use whole minutes.
      selector:
        time:
    days:
      description: Days of the week, required for new schedules.
      selector:
        select:
          multiple: true
          options:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday

delete_charge_schedule:
  name: Delete charge schedule
  description: Remove a multi-day charge schedule from the vehicle.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
    schedule_id:
      description: ID from Charge Schedules.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box

disable_charge_schedules:
  name: Disable all charge schedules
  description: Turn off all saved charge schedules without deleting their times or days.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na

set_climate_schedule:
  name: Set climate schedule
  description: Create or update a preconditioning schedule. Dates and times use Home Assistant's timezone.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
    schedule_id:
      description: ID from Climate Schedules. Omit to create a new schedule.
      selector:
        number:
          min: 0
          step: 1
          mode: box
    enabled:
      description: Enable or disable an existing schedule. New schedules are enabled.
      selector:
        boolean:
    start_time:
      description: Start time in Home Assistant's timezone, required for new schedules. Use whole minutes.
      selector:
        time:
    date:
      description: Date for a one-time schedule. Choose this or repeating days.
      selector:
        date:
    days:
      description: Repeating days of the week. Choose these or a single date.
      selector:
        select:
          multiple: true
          options:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
    temperature:
      description: Temperature in the unit shown by Climate Schedules, required for new schedules. Use the reported range and step.
      selector:
        number:
          step: any
          mode: box

delete_climate_schedule:
  name: Delete climate schedule
  description: Remove a saved preconditioning schedule.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
    schedule_id:
      description: ID from Climate Schedules.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
