engine_start:
  description: Remote start your Toyota vehicle.
  fields:
    vehicle:
      description:
        Device (vehicle) you wish to start.
      required: true
      selector:
        device:
          integration: toyota_na
charge_start:
  name: Charge now
  description: Start charging a plugged-in vehicle that reports charging is available.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
charge_resume:
  name: Resume charging
  description: Resume charging when the vehicle reports that charging can be resumed.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
charge_stop:
  name: Stop charging
  description: Stop charging when the vehicle reports support for stopping its current charge.
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: toyota_na
