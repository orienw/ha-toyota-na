[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Home Assistant must alias httpx before respx imports it; only respx's pytest plugin is off.
addopts = "-p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF012", "SIM105", "SIM117", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023", "RUF043", "ASYNC110"]

[tool.mypy]
files = ["custom_components/toyota_na"]
check_untyped_defs = true

# Home Assistant swaps voluptuous for its own schema library when it starts.
[[tool.mypy.overrides]]
module = "voluptuous.*"
follow_imports = "skip"

# Not yet clean. Remove a module from this list once it passes.
[[tool.mypy.overrides]]
module = ["toyota_na.diagnostics", "toyota_na.websocket_handler"]
ignore_errors = true
