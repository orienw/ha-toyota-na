name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.8.0"
            requirements: requirements-test-minimum.txt
          # Whatever Home Assistant is current when the job runs.
          - homeassistant: newest
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v7
      # Home Assistant 2026.8, the minimum, requires Python 3.14.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: ruff check .
      - run: ruff format --check .
      # Types are checked against the newest Home Assistant only.
      - run: mypy
        if: matrix.homeassistant == 'newest'
      - run: pytest -q
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      # The repository has no license yet.
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: license
